<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Добро пожаловать домой</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- НАЧАЛЬНЫЙ ЭКРАН -->
  <main id="welcome-screen" class="screen welcome-screen">
    <div class="welcome-card">
      <div class="welcome-decoration" aria-hidden="true"></div>

      <h1>Добро пожаловать!</h1>
      <p>За этой дверью вас ждёт уютный праздничный дом.</p>

      <button id="knock-button" class="knock-button" type="button">
        Постучать в дверь
      </button>
    </div>
  </main>

  <!-- ЭКРАН ПОСЛЕ ВХОДА -->
  <main id="home-screen" class="screen home-screen" hidden>
    <header class="home-header">
      <div class="ornament" aria-hidden="true">✦ ❄ ✦</div>
      <h1>Добро пожаловать домой, чертята!</h1>
    </header>

    <div class="content">
      <!-- ГОСТИНАЯ -->
      <section id="living-room-view" aria-label="Гостиная">
        <div class="room-frame">
          <img
            id="living-room"
            src="living-room.jpg"
            alt="Уютная праздничная гостиная"
          >
        </div>

        <p class="room-caption">Как хорошо быть дома ✨</p>
      </section>

      <!-- АДВЕНТ-КАЛЕНДАРЬ -->
      <section id="calendar-view" class="placeholder" hidden>
        <h2>Адвент-календарь</h2>
        <p>Этот раздел скоро появится.</p>
      </section>

      <!-- ЛИЧНАЯ КОМНАТА -->
      <section id="personal-room-view" class="placeholder" hidden>
        <h2>Личная комната</h2>
        <p>Этот раздел скоро появится.</p>

        <!-- Здесь будет отображаться результат сохранения -->
        <p id="user-status" role="status">
          Данные пользователя ещё не загружены.
        </p>
      </section>
    </div>

    <!-- НИЖНЕЕ МЕНЮ -->
    <nav class="navigation" aria-label="Навигация по дому">
      <button
        class="nav-button"
        type="button"
        data-view="calendar-view"
      >
        <span class="nav-icon">
          <img src="Presents.png" alt="">
        </span>
        <span class="nav-label">Адвент-календарь</span>
      </button>

      <button
        class="nav-button"
        type="button"
        data-view="living-room-view"
        aria-current="page"
      >
        <span class="nav-icon">
          <img src="Fire.png" alt="">
        </span>
        <span class="nav-label">Гостиная</span>
      </button>

      <button
        class="nav-button"
        type="button"
        data-view="personal-room-view"
      >
        <span class="nav-icon">
          <img src="home.png" alt="">
        </span>
        <span class="nav-label">Личная комната</span>
      </button>
    </nav>
  </main>

  <!-- Библиотека Telegram должна подключаться раньше script.js -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="script.js"></script>
</body>
</html>
