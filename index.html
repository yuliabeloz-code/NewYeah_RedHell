<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добро пожаловать домой</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            font-family: Georgia, serif;
            color: #fdf5e6;
            background: url('background01.jpg') no-repeat center center fixed;
            background-size: cover;
        }

        .screen {
            box-sizing: border-box;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .screen[hidden] {
            display: none;
        }

        /* Первый экран */
        .welcome-screen {
            justify-content: center;
        }

        .knock-btn {
            padding: 20px 35px;
            border: 3px solid #c5a059;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.6);
            color: #fdf5e6;
            font-family: inherit;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .knock-btn:hover {
            background: rgba(0, 0, 0, 0.8);
        }

        /* Экран после нажатия */
        h1 {
            margin-top: 50px;
            text-align: center;
            font-size: 3rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .buttons-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 40px;
            margin-top: auto;
            margin-bottom: 50px;
        }

        .btn {
            display: block;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid #c5a059;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s ease;
            background: rgba(0, 0, 0, 0.3);
        }

        .btn:hover {
            transform: scale(1.1);
        }

        .btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <!-- Первый экран -->
    <div class="screen welcome-screen" id="welcomeScreen">
        <button class="knock-btn" id="knockButton" type="button">
            Постучать в дверь
        </button>
    </div>

    <!-- Экран, который появится после нажатия -->
    <div class="screen" id="homeScreen" hidden>
        <h1>Добро пожаловать домой,<br>чертята!</h1>

        <div class="buttons-container">
            <!-- Адвент-календарь -->
            <a class="btn" href="advent.html">
                <img src="Presents.png" alt="Адвент-календарь">
            </a>

            <!-- Гостиная -->
            <a class="btn" href="living-room.html">
                <img src="Fire.png" alt="Гостиная">
            </a>

            <!-- Личная комната -->
            <a class="btn" href="room.html">
                <img src="Home.png" alt="Личная комната">
            </a>
        </div>
    </div>

    <script>
        const knockButton = document.getElementById('knockButton');
        const welcomeScreen = document.getElementById('welcomeScreen');
        const homeScreen = document.getElementById('homeScreen');

        knockButton.addEventListener('click', function () {
            welcomeScreen.hidden = true;
            homeScreen.hidden = false;
        });
    </script>

</body>
</html>
