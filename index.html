<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Моя ёлка</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-family: Arial, sans-serif;
      color: white;
      background: url('background.jpg') no-repeat center center fixed;
      background-size: cover;
    }

    button {
      padding: 14px 24px;
      border: 0;
      border-radius: 12px;
      font-size: 18px;
      background: #ffd966;
      cursor: pointer;
      font-weight: bold;
    }

    #message {
      min-height: 30px;
      font-size: 20px;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <main>
    <button onclick="knock()">Постучать в дверь</button>
    <p id="message"></p>
  </main>

  <script>
    function knock() {
      document.getElementById("message").textContent =
        "Добро пожаловать домой,чертята!";
    }
  </script>
</body>
</html>
