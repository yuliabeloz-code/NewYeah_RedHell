<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Моя ёлка</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;
      background:
        linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.5)),
        url("background.jpg") no-repeat center center fixed;
      background-size: cover;
    }

    [hidden] {
      display: none !important;
    }

    button {
      border: 0;
      cursor: pointer;
      font-family: inherit;
      font-weight: bold;
    }

    /* Первая страница */
    #welcome-screen {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .enter-button {
      padding: 14px 24px;
      border-radius: 12px;
      font-size: 18px;
      background: #ffd966;
      color: #332400;
    }

    /* Страницы главного меню */
    #app {
      min-height: 100vh;
      padding: 35px 20px 110px;
    }

    .welcome-message {
      margin: 0 0 30px;
      font-size: 20px;
    }

    .page {
      max-width: 500px;
      margin: 0 auto;
      padding: 24px;
      border-radius: 18px;
      background: rgba(25, 30, 28, 0.75);
    }

    .page h1 {
      margin-top: 0;
      font-size: 26px;
    }

    .page p {
      line-height: 1.5;
    }

    /* Кнопки внизу экрана */
    .navigation {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 0;
      display: flex;
      gap: 8px;
      padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
      background: rgba(25, 30, 28, 0.95);
    }

    .navigation button {
      flex: 1;
      min-width: 0;
      min-height: 54px;
      padding: 8px 4px;
      border-radius: 12px;
      font-size: 14px;
      color: white;
      background: #46564b;
    }

    .navigation button[aria-current="page"] {
      color: #332400;
      background: #ffd966;
    }
    /* Фон после входа */
#app {
  min-height: 100dvh;
  padding-top: 100px;
  background: radial-gradient(
    circle at top,
    #b82c35,
    #790f1d 70%,
    #4a0710
  );
}

/* Гирлянда */
.garland {
  position: fixed;
  z-index: 2;
  top: 0;
  left: 0;
  width: 100%;
  height: 65px;
  display: flex;
  justify-content: space-around;
  pointer-events: none;
}

/* Провод гирлянды */
.garland::before {
  content: "";
  position: absolute;
  top: 6px;
  left: 0;
  width: 100%;
  height: 22px;
  border-bottom: 2px solid #263a2a;
  border-radius: 0 0 50% 50%;
}

/* Лампочки */
.garland span {
  position: relative;
  top: 25px;
  width: 10px;
  height: 15px;
  border-radius: 50%;
  background: #ffe895;
  box-shadow: 0 0 8px 3px rgba(255, 225, 125, 0.65);
  animation: glow 2s ease-in-out infinite alternate;
}

.garland span:nth-child(3n + 2) {
  background: #a7f7bf;
  box-shadow: 0 0 8px 3px rgba(130, 255, 160, 0.6);
  animation-delay: 0.6s;
}

.garland span:nth-child(3n) {
  background: #ffafba;
  box-shadow: 0 0 8px 3px rgba(255, 140, 160, 0.6);
  animation-delay: 1.2s;
}

@keyframes glow {
  from { opacity: 0.6; }
  to { opacity: 1; }
}

/* Падающий снег */
.snow {
  position: fixed;
  z-index: 1;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}

.snow span {
  position: absolute;
  top: -30px;
  left: var(--left);
  color: white;
  font-size: var(--size);
  opacity: 0.8;
  animation: snowfall var(--duration) linear infinite;
  animation-delay: var(--delay);
}

@keyframes snowfall {
  from {
    transform: translateY(0) rotate(0deg);
  }
  to {
    transform: translateY(110vh) rotate(360deg);
  }
}

/* Текст и меню находятся поверх снега */
#app main,
.welcome-message {
  position: relative;
  z-index: 2;
}

.navigation {
  z-index: 3;
}

/* Учитываем настройку уменьшения движения */
@media (prefers-reduced-motion: reduce) {
  .snow span,
  .garland span {
    animation: none;
  }

  .snow {
    display: none;
  }
}
  </style>
</head>

<body>
  <!-- Первая страница -->
  <main id="welcome-screen">
    <button class="enter-button" type="button" onclick="enterHome()">
      Постучать в дверь
    </button>
  </main>

  <!-- Главное меню -->
  <div id="app" hidden>
    <div class="garland" aria-hidden="true">
  <span></span><span></span><span></span><span></span>
  <span></span><span></span><span></span><span></span>
  <span></span><span></span><span></span><span></span>
</div>

<div class="snow" aria-hidden="true">
  <span style="--left: 5%;  --size: 14px; --duration: 9s;  --delay: -2s;">❄</span>
  <span style="--left: 14%; --size: 10px; --duration: 12s; --delay: -7s;">❄</span>
  <span style="--left: 23%; --size: 16px; --duration: 10s; --delay: -4s;">❄</span>
  <span style="--left: 32%; --size: 11px; --duration: 13s; --delay: -9s;">❄</span>
  <span style="--left: 41%; --size: 13px; --duration: 11s; --delay: -1s;">❄</span>
  <span style="--left: 50%; --size: 10px; --duration: 9s;  --delay: -6s;">❄</span>
  <span style="--left: 59%; --size: 15px; --duration: 12s; --delay: -3s;">❄</span>
  <span style="--left: 68%; --size: 11px; --duration: 10s; --delay: -8s;">❄</span>
  <span style="--left: 77%; --size: 14px; --duration: 13s; --delay: -5s;">❄</span>
  <span style="--left: 86%; --size: 10px; --duration: 11s; --delay: -10s;">❄</span>
  <span style="--left: 94%; --size: 13px; --duration: 9s;  --delay: -4s;">❄</span>
</div>
    <p class="welcome-message">Добро пожаловать домой, чертята!</p>

    <main>
      <section id="advent" class="page" hidden>
        <h1> 🎁 Адвент-календарь</h1>
        <p>Здесь скоро появится адвент-календарь.</p>
      </section>

      <section id="living-room" class="page">
        <h1>🎄 Гостиная</h1>
        <p>Добро пожаловать в нашу праздничную гостиную!</p>
      </section>

      <section id="personal-room" class="page" hidden>
        <h1>🕯 Личная комната</h1>
        <p>Здесь скоро появится ваша личная комната.</p>
      </section>
    </main>

    <nav class="navigation" aria-label="Главное меню">
      <button type="button" data-page="advent" onclick="showPage('advent')">
        🎁<br>Адвент-календарь
      </button>

      <button
        type="button"
        data-page="living-room"
        aria-current="page"
        onclick="showPage('living-room')"
      >
        🎄<br>Гостиная
      </button>

      <button type="button" data-page="personal-room" onclick="showPage('personal-room')">
        🕯<br>Личная комната
      </button>
    </nav>
  </div>

  <script>
    function enterHome() {
      document.getElementById("welcome-screen").hidden = true;
      document.getElementById("app").hidden = false;
      showPage("living-room");
    }

    function showPage(pageId) {
      document.querySelectorAll(".page").forEach(function (page) {
        page.hidden = page.id !== pageId;
      });

      document.querySelectorAll(".navigation button").forEach(function (button) {
        if (button.dataset.page === pageId) {
          button.setAttribute("aria-current", "page");
        } else {
          button.removeAttribute("aria-current");
        }
      });

      window.scrollTo(0, 0);
    }
      </script>
</body>
</html>
