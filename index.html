<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Гостиная</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>
  <main id="app"></main>

  <nav id="navigation" class="navigation hidden">
    <button type="button" data-page="home">
      <img src="home.png" alt="">
      <span>Гостиная</span>
    </button>

    <button type="button" data-page="bedroom">
      <img src="bedroom.png" alt="">
      <span>Личная комната</span>

    <button type="button" data-page="advent">
      <img src="presents.png" alt="">
      <span>Адвент</span>

  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <button
        id="close-modal"
        class="close-button"
        type="button"
        aria-label="Закрыть"
      >×</button>

      <div id="modal-body"></div>
    </div>
  </div>

  <audio id="audio" preload="none"></audio>

    <script src="app.js"></script>
<script src="advent-games.js"></script>
